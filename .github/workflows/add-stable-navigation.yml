name: Add stable navigation to every page

on:
  push:
    paths:
      - '.github/workflows/add-stable-navigation.yml'
      - '*.html'
      - 'nav-stable.js'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[stable-nav-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stable navigation loader
        shell: bash
        run: |
          set -e
          changed=0
          for f in *.html; do
            [ -f "$f" ] || continue
            if grep -q 'nav-stable.js?v=stable-1' "$f"; then
              continue
            fi
            python - "$f" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/nav-stable.js?v=stable-1"></script>'
          if tag not in s:
              if '</body>' in s:
                  s = s.replace('</body>', tag + '\n</body>', 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY
            changed=1
          done
          if [ "$changed" = 0 ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m '[stable-nav-sync] Add stable navigation loader to all pages'
          git push
          rm -f .github/workflows/add-stable-navigation.yml
          git add .github/workflows/add-stable-navigation.yml
          git commit -m '[stable-nav-sync] Remove one-time navigation sync'
          git push
