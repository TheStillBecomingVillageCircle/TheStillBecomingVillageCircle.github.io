name: Use Exact Grace Home

on:
  push:
    paths:
      - 'assets/grace-home-exact.jpg'
      - '.github/workflows/use-exact-grace-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Home illustration with exact image
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacement = '''<div class="place grace-home-place"><a href="index.html" aria-label="Home"><div class="scene grace-home-scene"><img src="assets/grace-home-exact.jpg" alt="Grace's elegant modern home floating among the clouds" loading="eager" decoding="async"></div><span class="place-name">Home</span></a></div>'''

          pattern = r'<div class="place grace-home-place">.*?<span class="place-name">Home</span></a></div>'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Could not find the existing Grace Home block.')
          text = updated

          css = '''
/* Exact Grace Home image */
.grace-home-place{min-height:330px}
.grace-home-scene{width:min(420px,96vw);height:300px;overflow:hidden;border-radius:4px;display:flex;align-items:flex-start;justify-content:center;box-shadow:0 18px 42px rgba(63,126,119,.10)}
.grace-home-scene img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.grace-home-scene:after{display:none}
@media(max-width:760px){.grace-home-place{min-height:295px}.grace-home-scene{width:min(420px,94vw);height:275px}}
@media(max-width:480px){.grace-home-place{min-height:300px}.grace-home-scene{width:100%;height:280px}}
'''

          text = re.sub(r'\n/\* Grace\'s Home destination \*/.*?(?=</style>)', '\n' + css, text, count=1, flags=re.DOTALL)
          p.write_text(text, encoding='utf-8')

      - name: Commit and remove one-time updater
        shell: bash
        run: |
          git config user.name "The Still Becoming Village Circle"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use exact Grace house for Home"
            git push
          fi
          git rm .github/workflows/use-exact-grace-home.yml
          git commit -m "Remove one-time exact Home updater"
          git push
