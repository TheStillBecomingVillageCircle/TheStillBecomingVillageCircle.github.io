name: Remove Her From Village Tagline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the word her
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="village-tagline">The Village That Became Her</div>'
          new = '<div class="village-tagline">The Village That Became</div>'
          if old not in text:
              raise SystemExit('Expected tagline not found; no change made.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Remove her from Village tagline"
          git push
