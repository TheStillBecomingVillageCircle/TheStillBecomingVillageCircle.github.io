name: Fix Webspace Pyramid

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-pyramid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace pyramid artwork
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('web-design.html')
          html = path.read_text(encoding='utf-8')

          new_svg = '''<svg viewBox="0 0 1000 840" role="img" xmlns="http://www.w3.org/2000/svg">
          <defs><clipPath id="tri"><polygon points="500,8 992,830 8,830"/></clipPath></defs>
          <g clip-path="url(#tri)">
          <rect x="0" y="0" width="1000" height="260" fill="#ffd9d1"/>
          <rect x="0" y="260" width="1000" height="200" fill="#dff5ef"/>
          <rect x="0" y="460" width="1000" height="190" fill="#fff0cc"/>
          <rect x="0" y="650" width="1000" height="190" fill="#c9ece5"/>
          <line x1="0" y1="260" x2="1000" y2="260" stroke="#b98a32" stroke-width="3"/>
          <line x1="0" y1="460" x2="1000" y2="460" stroke="#b98a32" stroke-width="3"/>
          <line x1="0" y1="650" x2="1000" y2="650" stroke="#b98a32" stroke-width="3"/>

          <!-- DELIGHT icon -->
          <text x="500" y="48" text-anchor="middle" font-size="38" fill="#b57b17">♛</text>
          <rect x="456" y="60" width="88" height="58" rx="5" fill="none" stroke="#174f57" stroke-width="6"/>
          <path d="M442 126h116" stroke="#174f57" stroke-width="7" stroke-linecap="round"/>
          <path d="M480 91h40" stroke="#174f57" stroke-width="4"/>
          <text x="500" y="174" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="38" fill="#174f57">DELIGHT</text>

          <!-- REFRESHMENT icon + label -->
          <g transform="translate(235 305)">
            <path d="M0 25h70l-7 105H8z" fill="#fff" stroke="#174f57" stroke-width="5"/>
            <path d="M8 25c9-22 45-22 54 0" fill="none" stroke="#174f57" stroke-width="5"/>
            <path d="M10 52h42" stroke="#7bbd8f" stroke-width="9"/>
            <path d="M50 0c-5 25-11 34-25 51" fill="none" stroke="#5b8e43" stroke-width="7"/>
            <path d="M54 4c14 2 24 12 25 24-15 4-27-4-25-24z" fill="#6ca74e"/>
          </g>
          <text x="540" y="374" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="35" fill="#174f57">REFRESHMENT</text>

          <!-- ADDITIONS icon + label -->
          <path d="M115 505h108v-30h30v30h30v30h-30v30h-30v-30H115z" fill="#b57b17"/>
          <text x="199" y="527" text-anchor="middle" font-size="27" fill="#fff">♥</text>
          <text x="520" y="555" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="36" fill="#174f57">ADDITIONS</text>

          <!-- FOUNDATION icon + label -->
          <rect x="92" y="700" width="126" height="78" rx="7" fill="none" stroke="#174f57" stroke-width="7"/>
          <path d="M74 785h162l-24 19H98z" fill="#174f57"/>
          <path d="M118 733h74" stroke="#174f57" stroke-width="6"/>
          <path d="M145 755h22" stroke="#174f57" stroke-width="6"/>
          <text x="520" y="754" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="36" fill="#174f57">FOUNDATION</text>
          </g>
          <polygon points="500,8 992,830 8,830" fill="none" stroke="#b98a32" stroke-width="4"/>
          </svg>'''

          new_svg = re.sub(r'^\s+', '', new_svg, flags=re.MULTILINE)
          updated, count = re.subn(r'<svg viewBox="0 0 1000 840".*?</svg>', new_svg, html, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Could not find the existing pyramid SVG')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit website change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-webspace-pyramid.yml
          git add web-design.html .github/workflows/fix-webspace-pyramid.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Simplify Webspace pyramid labels"
          git push
