name: Fix Inside the Bubble Booking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update booking link and wording
        shell: python
        run: |
          from pathlib import Path

          p = Path('about.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'href="#conversation">💬 Ready to Have the Conversation? &nbsp;→',
              'href="#booking">Ready to Take the Next Step? &nbsp;→',
              1
          )

          text = text.replace(
              '<div class="calendly-wrapper">',
              '<div class="calendly-wrapper" id="booking">',
              1
          )

          text = text.replace(
              '🫧 Choose Your Time',
              'Find Your Moment',
              1
          )

          p.write_text(text, encoding='utf-8')
          print('Inside the Bubble booking flow updated.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Remove emojis from booking flow"
          git push
