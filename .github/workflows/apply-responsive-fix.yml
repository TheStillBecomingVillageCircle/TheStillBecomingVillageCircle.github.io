name: Apply responsive fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add responsive stylesheet and load it on every HTML page
        shell: python
        run: |
          from pathlib import Path

          css = r'''/* TSBVC Responsive Safety Layer */
          html{overflow-x:clip!important}
          body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
          img,video{max-width:100%;height:auto}
          iframe{max-width:100%}
          main,main>section,main article,main .section,main .section-box,main .thought,main .scope,main .cta,main .card,main .person,main .mission-box,main .calendly-wrapper{min-width:0;max-width:100%}
          @media(max-width:900px){
            main [style*="grid-template-columns"]{grid-template-columns:1fr!important}
            main .cards,main .person-grid,main .question-grid,main .bubbleMessages{grid-template-columns:1fr!important}
            main .section{display:block!important;width:100%!important}
            main .section>*{min-width:0;max-width:100%}
            main .thought,main .scope,main .cta,main .section-box,main .mission-box{width:100%!important;max-width:100%!important}
            main .thought,main .scope,main .cta,main .card,main .person{overflow-wrap:anywhere}
            main [style*="display:flex"]{min-width:0}
          }
          @media(max-width:600px){
            main [style*="grid-template-columns"]{grid-template-columns:1fr!important}
            main .section{padding-left:5%!important;padding-right:5%!important}
            main .thought,main .scope,main .cta,main .section-box,main .mission-box{padding-left:25px!important;padding-right:25px!important}
            #villageSoundtrack{right:8px!important;bottom:10px!important;max-width:calc(100vw - 16px)!important}
            #villageSoundtrack.open .content{right:8px!important;left:8px!important;width:auto!important;max-width:none!important}
            #bubbleCompanion,.floating-bubble{max-width:calc(100vw - 24px)!important}
            #bubbleCompanion .bubbleText,.bubbleText{white-space:normal!important;overflow-wrap:anywhere!important;max-width:calc(100vw - 24px)!important}
          }
          @media(max-width:430px){
            main h1{max-width:100%!important;overflow-wrap:anywhere}
            main h2,main h3{max-width:100%!important;overflow-wrap:anywhere}
          }
          '''
          css = '\n'.join(line.strip() for line in css.splitlines()).strip() + '\n'
          Path('responsive-fixes.css').write_text(css, encoding='utf-8')

          marker = 'responsive-fixes.css?v=20260902-1'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              needle = '</head>'
              if needle.lower() not in text.lower():
                  continue
              idx = text.lower().rfind(needle)
              link = f'<link rel="stylesheet" href="responsive-fixes.css?v=20260902-1">\n'
              text = text[:idx] + link + text[idx:]
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-responsive-fix.yml').unlink()

      - name: Commit responsive fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add responsive-fixes.css *.html .github/workflows/apply-responsive-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix responsive layouts across site"
          git push
