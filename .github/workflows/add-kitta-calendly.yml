name: Add Kitta Calendly

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add Kitta Calendly booking') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Kitta booking link
        shell: python
        run: |
          from pathlib import Path

          p = Path('kitta.html')
          text = p.read_text(encoding='utf-8')

          marker = '''<a
    href="contact.html"
    class="cta-button"
>

    🎨 Explore Creative Work

</a>'''

          replacement = '''<a
    href="https://calendly.com/thestillbecomingvillagecircle/new-meeting"
    class="cta-button"
    target="_blank"
    rel="noopener"
>

    🎨 Allow Becoming to Create Your Vision

</a>'''

          if 'https://calendly.com/thestillbecomingvillagecircle/new-meeting' not in text:
              if marker not in text:
                  raise SystemExit('Expected Kitta CTA was not found')
              text = text.replace(marker, replacement, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Kitta Calendly link is already present.')

      - name: Remove temporary workflow
        run: rm -f .github/workflows/add-kitta-calendly.yml

      - name: Commit booking link
        run: |
          git config user.name "TheStillBecomingVillageCircle"
          git config user.email "waterwinewednesday@gmail.com"
          git add kitta.html .github/workflows/add-kitta-calendly.yml
          git commit -m "Add Kitta Calendly booking"
          git push

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
