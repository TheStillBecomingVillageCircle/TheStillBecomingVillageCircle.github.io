name: Fix Home layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix index layout
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('<header>')
          end = s.find('</header>', start)
          if start == -1 or end == -1:
              raise SystemExit('header not found')
          end += len('</header>')

          header = '''<header><nav class="village-top-nav"><a class="logo" href="index.html" aria-label="The Still Becoming Village Circle"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 25C14 16 16 8 24 4" fill="none" stroke="#5d8f5c" stroke-width="2.2" stroke-linecap="round"/><path d="M17 11C20 5 25 5 26 5c-.6 4-3.4 7-9 7Z" fill="#8ab879"/><path d="M14 16C10 10 5 10 3 11c1 4 4 7 11 7Z" fill="#79aa69"/></svg><span>The Still Becoming Village Circle</span></a><div class="village-top-links" aria-label="Village navigation"><a href="index.html">Home</a><a href="about.html">Inside the Bubble</a><a href="LearningtheUnknown.html">The Unknown</a><a href="events.html">Experiences</a><a href="web-design.html">Webspace</a><a href="contact.html">Connect</a><a href="support.html">Support</a></div></nav></header>'''
          s = s[:start] + header + s[end:]

          css = '''
/* Final Home + navigation sizing */
.village-top-nav{max-width:1280px;margin:auto;min-height:82px;padding:12px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.village-top-nav .logo{font-size:20px}
.village-top-links{width:100%;display:flex;align-items:center;justify-content:center;gap:22px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 4px 4px}
.village-top-links::-webkit-scrollbar{display:none}
.village-top-links a{font:600 13px/1.2 Arial,Helvetica,sans-serif;letter-spacing:.02em;color:#315f5d;flex:0 0 auto;padding:5px 2px}
.village-top-links a:hover,.village-top-links a:focus-visible{color:#18a6a2}
.grace-home-place{min-height:255px}
.grace-home-scene{width:min(360px,82vw);height:215px;overflow:hidden;border-radius:10px;box-shadow:0 14px 32px rgba(63,126,119,.10)}
.grace-home-scene img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
@media(max-width:760px){.village-top-nav{padding:11px 14px 9px;gap:7px}.village-top-nav .logo{font-size:17px}.village-top-links{justify-content:flex-start;gap:18px}.village-top-links a{font-size:12px}.grace-home-place{min-height:220px}.grace-home-scene{width:min(310px,82vw);height:185px}}
@media(max-width:480px){.village-top-nav .logo{font-size:16px}.village-top-links{gap:16px}.village-top-links a{font-size:11px}.grace-home-place{min-height:210px}.grace-home-scene{width:min(300px,82vw);height:175px}}
'''
          if '/* Final Home + navigation sizing */' in s:
              s = re.sub(r'\n/\* Final Home \+ navigation sizing \*/.*?(?=</style>)', '\n'+css, s, count=1, flags=re.S)
          else:
              s = s.replace('</style>', css+'</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Home image size and horizontal navigation"
          git push
