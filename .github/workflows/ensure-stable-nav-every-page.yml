name: Ensure stable navigation on every page

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'nav-stable.js'
      - '.github/workflows/ensure-stable-nav-every-page.yml'

permissions:
  contents: write

jobs:
  ensure-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure stable navigation loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '<script src="/nav-stable.js?v=stable-2"></script>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '/nav-stable.js' not in text:
                  if '</body>' not in text:
                      continue
                  text = text.replace('</body>', tag + '\n</body>', 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit navigation loader fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git add '*.html'
          git commit -m '[stable-nav] Ensure shared navigation loader on every page'
          git push

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/ensure-stable-nav-every-page.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[stable-nav] Remove one-time navigation workflow'
          git push
