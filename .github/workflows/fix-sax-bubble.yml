name: Make soundtrack saxophone a bubble

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bubble saxophone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('village-music.js')
          s = p.read_text()
          old = "#${PLAYER_ID} .sax{font-size:48px;line-height:1;filter:drop-shadow(0 3px 5px rgba(40,95,97,.14));transform:translateY(-2px)}"
          new = "#${PLAYER_ID} .sax{width:58px;height:58px;display:flex;align-items:center;justify-content:center;filter:none;transform:none;position:relative}.sax-bubble{width:54px;height:54px;display:block;filter:drop-shadow(0 3px 6px rgba(40,120,120,.10))}.sax-bubble .glass{fill:url(#saxGlass);stroke:rgba(255,255,255,.78);stroke-width:1.4}.sax-bubble .shine{fill:none;stroke:rgba(255,255,255,.88);stroke-width:2;stroke-linecap:round}.sax-bubble .body{fill:rgba(203,250,246,.30);stroke:rgba(40,120,120,.34);stroke-width:1.7}.sax-bubble .key{fill:rgba(255,255,255,.52);stroke:rgba(40,120,120,.28);stroke-width:1}.sax-bubble .rim{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.70);stroke-width:1.2}"
          if old not in s:
              raise SystemExit('Old sax CSS not found')
          s = s.replace(old, new, 1)
          old_html = '<span class="sax" aria-hidden="true">🎷</span>'
          new_html = '''<span class="sax" aria-hidden="true"><svg class="sax-bubble" viewBox="0 0 64 64" role="img" aria-label="Translucent bubble saxophone"><defs><radialGradient id="saxGlass" cx="30%" cy="22%" r="78%"><stop offset="0" stop-color="rgba(255,255,255,.82)"/><stop offset=".45" stop-color="rgba(213,255,250,.36)"/><stop offset="1" stop-color="rgba(142,225,220,.14)"/></radialGradient></defs><circle class="glass" cx="32" cy="32" r="25"/><path class="body" d="M39 13c-2 4-3 8-3 13v11c0 7-4 12-10 12-5 0-8-3-8-7 0-4 3-7 7-7h7V24c0-5 2-9 5-12z"/><path class="rim" d="M40 12c5 1 9 5 10 10"/><circle class="key" cx="28" cy="28" r="2.7"/><circle class="key" cx="28" cy="35" r="2.7"/><circle class="key" cx="28" cy="42" r="2.7"/><path class="shine" d="M17 20c3-7 8-11 14-12"/><path class="shine" d="M44 45c3-3 5-6 6-10"/></svg></span>'''
          if old_html not in s:
              raise SystemExit('Old sax HTML not found')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add village-music.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make soundtrack saxophone translucent bubble'
          git push
