name: Normalize stable navigation loaders

on:
  push:
    paths:
      - '.github/workflows/normalize-stable-navigation.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('/nav-stable.js?v=stable-1', '/nav-stable.js?v=stable-2')
              text = text.replace('nav-stable.js?v=stable-1', 'nav-stable.js?v=stable-2')
              text = text.replace('\\n<script src="site-fixes.js?v=20260901-24"></script>', '')
              text = text.replace('\\n<script src="rich-nav.js?v=20260901-24"></script>', '')
              text = text.replace('<script src="site-fixes.js?v=20260901-24"></script>\\n', '')
              text = text.replace('<script src="rich-nav.js?v=20260901-24"></script>\\n', '')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit normalized navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No navigation normalization needed.'
          else
            git commit -m '[stable-nav] Normalize all page loaders to stable-2'
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/normalize-stable-navigation.yml
          git add .github/workflows/normalize-stable-navigation.yml
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m '[stable-nav] Remove one-time normalization workflow'
            git push
          fi
