name: Repair Live Village Site

on:
  workflow_run:
    workflows: ["Install Persistent Village Navigation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install live polish script on every page
        shell: python
        run: |
          from pathlib import Path
          tag = '<script src="site-fixes.js?v=20260825"></script>'
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'site-fixes.js' in text:
                  continue
              pos = text.lower().rfind('</body>')
              if pos == -1:
                  continue
              text = text[:pos] + '\n' + tag + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('Installed on:', ', '.join(changed) if changed else 'none')

      - name: Commit live fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' site-fixes.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Repair live responsive Village site"
          git push
