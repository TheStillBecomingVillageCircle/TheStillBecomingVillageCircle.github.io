name: Apply shared navigation v4
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fresh navigation loader to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          loader = '<script src="/village-navigation.js?v=20260901-1"></script>'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if loader in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', loader + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed the loader."
            exit 0
          fi
          git commit -m "Apply shared navigation v4 to all pages"
          git push
