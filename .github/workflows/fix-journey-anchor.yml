name: Fix Journey Anchor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Journey CTA
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('about.html')
          text = p.read_text(encoding='utf-8')

          # Give the visible Find Your Moment link and the Calendly widget unique IDs.
          text = text.replace('<p class="calendly-link-wrap" id="booking">', '<p class="calendly-link-wrap" id="find-your-moment">', 1)
          text = text.replace('<div class="calendly-wrapper" id="booking">', '<div class="calendly-wrapper" id="booking-widget">', 1)

          # Make the Journey CTA a real button so no anchor/navigation handler can hijack it.
          pattern = r'<a\s+class="conversation-link"[^>]*>.*?</a>'
          replacement = '<button type="button" class="conversation-link" onclick="document.getElementById(\'find-your-moment\').scrollIntoView({behavior:\'smooth\', block:\'start\'});">🌱 Let’s Take a Journey Into Your Becoming &nbsp;→</button>'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count:
              text = updated

          # Keep the button visually identical to the Village's soft pill links.
          old_css = '.conversation-link { margin-top: 10px !important; padding: 13px 24px; border-radius: 35px; background: rgba(22,170,169,0.10); box-shadow: 0 10px 24px rgba(40,120,120,0.08); }'
          new_css = '.conversation-link { margin-top: 10px !important; padding: 13px 24px; border: 0; border-radius: 35px; background: rgba(22,170,169,0.10); color: #16aaa9; font-family: inherit; font-size: inherit; font-weight: 700; line-height: 1.4; cursor: pointer; appearance: none; -webkit-appearance: none; box-shadow: 0 10px 24px rgba(40,120,120,0.08); transition: transform 0.25s ease, background 0.25s ease; }'
          text = text.replace(old_css, new_css, 1)

          p.write_text(text, encoding='utf-8')
          print('Journey CTA target and styling fixed.')

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Style Journey CTA to match Village design"
          git push
