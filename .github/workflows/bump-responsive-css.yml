name: Bust responsive CSS cache
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stylesheet version
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = False
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns = s.replace('responsive-fixes.css?v=20260902-6', 'responsive-fixes.css?v=20260902-7')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed = True
          if changed:
              print('Updated responsive stylesheet cache version.')
          else:
              print('No old stylesheet version found; nothing to commit.')
          PY
      - name: Commit cache-busting change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Bust responsive CSS cache'
            git push
          fi
