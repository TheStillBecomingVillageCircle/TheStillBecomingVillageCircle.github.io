name: Bust responsive CSS and reading-flow cache
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation cache and exact label
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = False
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns = s.replace('responsive-fixes.css?v=20260902-12', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260902-13', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260902-14', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260903-15', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260903-16', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260903-17', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('responsive-fixes.css?v=20260903-18', 'responsive-fixes.css?v=20260903-19')
              ns = ns.replace('Inside the Village', 'Inside the Bubble')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed = True
          if changed:
              print('Updated responsive CSS cache version and Inside the Bubble label.')
          else:
              print('No HTML changes needed.')
          PY
      - name: Commit navigation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Bust responsive navigation CSS cache'
            git push
          fi
