name: Bust responsive CSS and reading-flow cache
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache-busting versions and four-item nav crops
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed = False
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns = re.sub(r'responsive-fixes\.css\?v=[^\"\']+', 'responsive-fixes.css?v=20260902-12', s)
              ns = re.sub(r'reading-flow\.js\?v=[^\"\']+', 'reading-flow.js?v=20260902-6', ns)
              ns = ns.replace('background-position:20% 0%;', 'background-position:18% 0%;')
              ns = ns.replace('background-position:80% 0%;', 'background-position:71% 0%;')
              ns = ns.replace('background-position:100% 0%;clip-path:inset(0 14% 0 0);', 'background-position:86% 0%;')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed = True
          if changed:
              print('Updated cache versions and four-item watercolor navigation crops.')
          else:
              print('No cache/nav changes needed.')
          PY
      - name: Commit cache-busting change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refresh four-item watercolor navigation cache'
            git push
          fi
