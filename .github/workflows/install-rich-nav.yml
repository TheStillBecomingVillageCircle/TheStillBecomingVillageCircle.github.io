name: Install Rich Village Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-rich-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add rich navigation script to every page
        shell: python
        run: |
          from pathlib import Path
          tag = '<script src="rich-nav.js?v=20260827"></script>'
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'rich-nav.js' in text:
                  continue
              pos = text.lower().rfind('</body>')
              if pos == -1:
                  continue
              text = text[:pos] + '\n' + tag + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('Rich navigation added:', ', '.join(changed) if changed else 'none')

      - name: Commit rich navigation installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Install rich illustrated navigation"
          git push
