name: Remove legacy hardcoded headers

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-hardcoded-headers.yml'
      - '*.html'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy hardcoded headers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'<header\\b[^>]*>.*?</header>\\s*', '', text, flags=re.I | re.S)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No legacy headers found.'
            exit 0
          fi
          git commit -m '[stable-nav] Remove legacy hardcoded headers'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/remove-legacy-hardcoded-headers.yml
          git add .github/workflows/remove-legacy-hardcoded-headers.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[stable-nav] Remove one-time header cleanup workflow'
          git push
