name: Remove event decor from Inside the Bubble

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-event-decor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Remove event decor wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          old = 'personalized artwork, memorial pieces, gift baskets, care packages, event décor, creative concepts, and behind-the-scenes marketing support.'
          new = 'personalized artwork, memorial pieces, gift baskets, care packages, creative concepts, and behind-the-scenes marketing support.'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about.html
          if git diff --cached --quiet; then
            echo 'No event decor wording found; nothing to commit.'
          else
            git commit -m 'Remove event decor from Kitta profile'
            git push
          fi
