name: One Time Navigation Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean navigation and fix destinations
        shell: python
        run: |
          from pathlib import Path
          import re

          nav = '''<!-- TSBVC-STATIC-NAV-START -->
          <div id="tsbvc-static-nav" data-navigation="exact-original-v1" style="width:100%;background:#fff;border-bottom:1px solid rgba(22,84,91,.08);position:relative;z-index:9000;overflow:hidden;line-height:0;">
            <div style="position:relative;width:100%;aspect-ratio:1093.5/396;overflow:hidden;background:#fff;">
              <img src="/assets/B307A382-B6FC-4D8D-81C5-3047BDE8F4E3.png?v=exact-original-v1" alt="" draggable="false" style="position:absolute;left:0;top:0;width:118%;height:auto;max-width:none;display:block;clip-path:inset(0 0 22% 0);-webkit-clip-path:inset(0 0 22% 0);pointer-events:none;user-select:none;">
              <a href="index.html?nav=static-1" aria-label="Home" style="position:absolute;left:0;top:0;width:19.02%;height:78.3%;z-index:3;display:block;"></a>
              <a href="about.html?nav=static-1" aria-label="Inside the Bubble" style="position:absolute;left:19.02%;top:0;width:18.24%;height:78.3%;z-index:3;display:block;"></a>
              <a href="LearningtheUnknown.html?nav=static-1" aria-label="The Unknown" style="position:absolute;left:37.26%;top:0;width:15.91%;height:78.3%;z-index:3;display:block;"></a>
              <a href="events.html?nav=static-1" aria-label="Experiences" style="position:absolute;left:53.17%;top:0;width:14.97%;height:78.3%;z-index:3;display:block;"></a>
              <a href="web-design.html?nav=static-1" aria-label="Webspace" style="position:absolute;left:68.14%;top:0;width:16.06%;height:78.3%;z-index:3;display:block;"></a>
              <a href="coming-together.html?nav=static-1" aria-label="Be Coming Together" style="position:absolute;left:84.20%;top:0;width:15.80%;height:78.3%;z-index:3;display:block;"></a>
              <div style="position:absolute;left:0;right:0;bottom:0;height:21.7%;display:grid;grid-template-columns:19.02% 18.24% 15.91% 14.97% 16.06% 15.80%;align-items:center;background:#fff;z-index:4;line-height:1;">
                <a href="index.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Home</a>
                <a href="about.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Inside the Bubble</a>
                <a href="LearningtheUnknown.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">The Unknown</a>
                <a href="events.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Experiences</a>
                <a href="web-design.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Webspace</a>
                <a href="coming-together.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Be Coming Together</a>
              </div>
            </div>
          </div>
          <!-- TSBVC-STATIC-NAV-END -->'''
          nav = nav.replace('          ', '')

          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')

              # Remove any legacy page nav; the exact six-link navigation is the only nav now.
              text = re.sub(r'<nav\b[^>]*>.*?</nav>', '', text, flags=re.DOTALL | re.IGNORECASE)

              # Remove legacy dynamic navigation loaders.
              text = re.sub(r'\s*<script[^>]+(?:nav-stable-v3|village-navigation)\.js[^>]*></script>', '', text, flags=re.IGNORECASE)

              # All Experiences navigation goes to the real Experiences page.
              text = text.replace('href="experiences.html"', 'href="events.html"')

              # Ensure every page has the exact static six-link navigation.
              if 'TSBVC-STATIC-NAV-START' not in text:
                  text = re.sub(r'(<body\b[^>]*>)', r'\1\n' + nav, text, count=1, flags=re.IGNORECASE)

              # The Journey CTA must be a real link to the Find Your Moment/coaching page.
              if p.name == 'about.html':
                  text = re.sub(r'<button[^>]*class="conversation-link"[^>]*>.*?</button>', '<a href="coaching.html" class="conversation-link">🌱 Let’s Take a Journey Into Your Becoming &nbsp;→</a>', text, count=1, flags=re.DOTALL | re.IGNORECASE)

              p.write_text(text, encoding='utf-8')

      - name: Commit and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-navigation-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/one-time-navigation-cleanup.yml
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git commit -m "Fix navigation links and remove duplicate menu"
          git push
