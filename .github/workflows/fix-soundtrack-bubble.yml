name: Fix soundtrack bubble sax and scroll playback

on:
  push:
    paths-ignore:
      - '.github/workflows/fix-soundtrack-bubble.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply soundtrack fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('village-music.js')
          s = p.read_text()

          old_css = "#${PLAYER_ID} .music-orb{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.92),rgba(216,255,250,.54) 48%,rgba(166,235,229,.22));border:2px solid rgba(255,255,255,.82);box-shadow:inset 7px 7px 16px rgba(255,255,255,.82),inset -6px -6px 14px rgba(55,170,177,.10),0 10px 24px rgba(40,120,120,.10)}"
          new_css = "#${PLAYER_ID} .music-orb{width:104px;height:104px;display:flex;align-items:center;justify-content:center;position:relative;background:transparent;border:0;box-shadow:none}"
          if old_css not in s: raise SystemExit('music-orb CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_sax_css = "#${PLAYER_ID} .sax{width:58px;height:58px;display:flex;align-items:center;justify-content:center;filter:none;transform:none;position:relative}.sax-bubble{width:54px;height:54px;display:block;filter:drop-shadow(0 3px 6px rgba(40,120,120,.10))}.sax-bubble .glass{fill:url(#saxGlass);stroke:rgba(255,255,255,.78);stroke-width:1.4}.sax-bubble .shine{fill:none;stroke:rgba(255,255,255,.88);stroke-width:2;stroke-linecap:round}.sax-bubble .body{fill:rgba(203,250,246,.30);stroke:rgba(40,120,120,.34);stroke-width:1.7}.sax-bubble .key{fill:rgba(255,255,255,.52);stroke:rgba(40,120,120,.28);stroke-width:1}.sax-bubble .rim{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.70);stroke-width:1.2}"
          new_sax_css = "#${PLAYER_ID} .sax{width:72px;height:72px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 8px rgba(40,120,120,.12));transform:none;position:relative}.sax-bubble{width:70px;height:70px;display:block;overflow:visible}.sax-bubble .body{fill:url(#saxGlass);stroke:rgba(255,255,255,.86);stroke-width:1.5}.sax-bubble .edge{fill:none;stroke:rgba(40,120,120,.28);stroke-width:1.5}.sax-bubble .shine{fill:none;stroke:rgba(255,255,255,.92);stroke-width:2.2;stroke-linecap:round}.sax-bubble .key{fill:rgba(255,255,255,.48);stroke:rgba(40,120,120,.22);stroke-width:1}.sax-bubble .bubble-highlight{fill:rgba(255,255,255,.34);stroke:rgba(255,255,255,.72);stroke-width:1}"
          if old_sax_css not in s: raise SystemExit('sax CSS not found')
          s = s.replace(old_sax_css, new_sax_css, 1)

          old_html = '<span class="sax" aria-hidden="true"><svg class="sax-bubble" viewBox="0 0 64 64" role="img" aria-label="Translucent bubble saxophone"><defs><radialGradient id="saxGlass" cx="30%" cy="22%" r="78%"><stop offset="0" stop-color="rgba(255,255,255,.82)"/><stop offset=".45" stop-color="rgba(213,255,250,.36)"/><stop offset="1" stop-color="rgba(142,225,220,.14)"/></radialGradient></defs><circle class="glass" cx="32" cy="32" r="25"/><path class="body" d="M39 13c-2 4-3 8-3 13v11c0 7-4 12-10 12-5 0-8-3-8-7 0-4 3-7 7-7h7V24c0-5 2-9 5-12z"/><path class="rim" d="M40 12c5 1 9 5 10 10"/><circle class="key" cx="28" cy="28" r="2.7"/><circle class="key" cx="28" cy="35" r="2.7"/><circle class="key" cx="28" cy="42" r="2.7"/><path class="shine" d="M17 20c3-7 8-11 14-12"/><path class="shine" d="M44 45c3-3 5-6 6-10"/></svg></span>'
          new_html = '<span class="sax" aria-hidden="true"><svg class="sax-bubble" viewBox="0 0 80 80" role="img" aria-label="Translucent bubble saxophone"><defs><radialGradient id="saxGlass" cx="28%" cy="18%" r="92%"><stop offset="0" stop-color="rgba(255,255,255,.78)"/><stop offset=".38" stop-color="rgba(213,255,250,.42)"/><stop offset=".75" stop-color="rgba(142,225,220,.20)"/><stop offset="1" stop-color="rgba(255,255,255,.06)"/></radialGradient></defs><path class="body" d="M48 10c-3 7-5 14-5 22v19c0 9-5 17-14 17-7 0-12-4-12-10 0-6 5-10 11-10h10V30c0-9 3-15 8-20z"/><path class="edge" d="M48 10c7 1 13 6 16 12M17 58c-3 2-5 6-5 10 0 7 6 12 14 12 10 0 18-9 18-19"/><circle class="key" cx="37" cy="33" r="3"/><circle class="key" cx="37" cy="42" r="3"/><circle class="key" cx="37" cy="51" r="3"/><path class="shine" d="M23 22c4-8 10-12 18-14"/><path class="shine" d="M55 56c5-5 8-11 9-17"/><circle class="bubble-highlight" cx="60" cy="17" r="5"/><circle class="bubble-highlight" cx="67" cy="26" r="2.5"/></svg></span>'
          if old_html not in s: raise SystemExit('sax HTML not found')
          s = s.replace(old_html, new_html, 1)

          old_scroll = """        let startedByScroll = false;\n\n        function startFromUserScroll() {\n            if (startedByScroll || window.scrollY <= 4) return;\n            startedByScroll = true;\n            pendingScrollPlay = true;\n            playSoundtrack();\n            window.removeEventListener('scroll', startFromUserScroll);\n            window.removeEventListener('wheel', startFromUserScroll);\n            window.removeEventListener('touchmove', startFromUserScroll);\n        }\n\n        window.addEventListener('scroll', startFromUserScroll, { passive:true });\n        window.addEventListener('wheel', startFromUserScroll, { passive:true });\n        window.addEventListener('touchmove', startFromUserScroll, { passive:true });"""
          new_scroll = """        let startedByScroll = false;\n\n        function startFromUserScroll() {\n            if (startedByScroll) return;\n            startedByScroll = true;\n            pendingScrollPlay = true;\n            playSoundtrack();\n            window.removeEventListener('scroll', startFromUserScroll);\n            window.removeEventListener('wheel', startFromUserScroll);\n            window.removeEventListener('touchmove', startFromUserScroll);\n            window.removeEventListener('touchstart', startFromUserScroll);\n            window.removeEventListener('pointerdown', startFromUserScroll);\n        }\n\n        window.addEventListener('touchstart', startFromUserScroll, { passive:true, once:true });\n        window.addEventListener('pointerdown', startFromUserScroll, { passive:true, once:true });\n        window.addEventListener('scroll', startFromUserScroll, { passive:true });\n        window.addEventListener('wheel', startFromUserScroll, { passive:true });\n        window.addEventListener('touchmove', startFromUserScroll, { passive:true });"""
          if old_scroll not in s: raise SystemExit('scroll playback block not found')
          s = s.replace(old_scroll, new_scroll, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add village-music.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refine bubble sax and trigger soundtrack on scroll'
          git push
