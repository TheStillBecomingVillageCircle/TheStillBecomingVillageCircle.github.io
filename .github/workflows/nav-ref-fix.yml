name: One-time navigation reference fix

on:
  push:
    paths:
      - '.github/workflows/nav-ref-fix.yml'
      - 'LearningtheUnknown.html'
      - 'coming-together.html'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nav-ref-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared navigation script URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('LearningtheUnknown.html'), Path('coming-together.html')]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('site-fixes.js?v=20260828-7', 'site-fixes.js?v=20260901-23')
              s = s.replace('site-fixes.js?v=20260901-20', 'site-fixes.js?v=20260901-23')
              s = s.replace('rich-nav.js?v=20260827', 'rich-nav.js?v=20260901-23')
              s = s.replace('rich-nav.js?v=20260901-20', 'rich-nav.js?v=20260901-23')
              p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LearningtheUnknown.html coming-together.html
          git diff --cached --quiet && exit 0
          git commit -m '[nav-ref-fix] Refresh shared navigation references'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/nav-ref-fix.yml
          git add .github/workflows/nav-ref-fix.yml
          git commit -m '[nav-ref-fix] Remove one-time workflow'
          git push
