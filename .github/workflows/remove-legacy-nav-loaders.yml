name: Remove legacy navigation loaders

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-nav-loaders.yml'

permissions:
  contents: write

jobs:
  remove-legacy-loaders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy shared navigation scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              lines = path.read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if 'site-fixes.js' not in line and 'rich-nav.js' not in line]
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No legacy navigation loaders found.'
          else
            git commit -m '[stable-nav] Remove legacy navigation loaders'
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/remove-legacy-nav-loaders.yml
          git add .github/workflows/remove-legacy-nav-loaders.yml
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m '[stable-nav] Remove one-time legacy-loader workflow'
            git push
          fi
