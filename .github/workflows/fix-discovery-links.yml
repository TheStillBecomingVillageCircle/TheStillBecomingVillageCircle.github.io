name: Fix discovery card links

on:
  push:
    paths:
      - '.github/workflows/fix-discovery-links.yml'

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add discovery links without changing page content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = {
              '''                <h3>\n                    📚 Learning the Unknown\n                </h3>''': '''                <h3>\n                    <a class="card-link" href="LearningtheUnknown.html">\n                        📚 Learning the Unknown 🔗\n                    </a>\n                </h3>''',
              '''                <h3>\n                    💬 Real Conversations\n                </h3>''': '''                <h3>\n                    <a class="card-link" href="events.html">\n                        💬 Real Conversations 🔗\n                    </a>\n                </h3>''',
              '''                <h3>\n                    🌱 Growing Together\n                </h3>''': '''                <h3>\n                    <a class="card-link" href="experiences.html">\n                        🌱 Growing Together 🔗\n                    </a>\n                </h3>'''
          }

          for old, new in replacements.items():
              if old in text and new not in text:
                  text = text.replace(old, new, 1)

          css = '''\n        .card-link {\n            color: #16aaa9;\n            text-decoration: none;\n        }\n\n        .card-link:hover {\n            text-decoration: underline;\n        }\n'''

          marker = '        .card p {\n'
          if '.card-link {' not in text and marker in text:
              text = text.replace(marker, css + '\n' + marker, 1)

          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add discovery card links'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-discovery-links.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary discovery link workflow'
          git push || true
