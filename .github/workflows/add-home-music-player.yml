name: Add Village music player to Home

on:
  push:
    paths:
      - '.github/workflows/add-home-music-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Add music player loader to Home
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="/village-music.js?v=20260901-bubble"></script>'
          if marker not in text:
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Home page has no closing body tag')
              text = text[:pos] + marker + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')

      - name: Commit Home player fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add translucent music bubble to Home page'
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-home-music-player.yml
          git add .github/workflows/add-home-music-player.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary Home music workflow'
          git push
