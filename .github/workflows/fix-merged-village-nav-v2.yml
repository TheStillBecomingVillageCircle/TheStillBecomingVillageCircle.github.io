name: Fix merged Village navigation v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize merged Village navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          nav = '''<!-- TSBVC-STATIC-NAV-START -->
          <div id="tsbvc-static-nav" data-navigation="merged-village-v1" style="width:100%;background:#fff;border-bottom:1px solid rgba(22,84,91,.08);position:relative;z-index:9000;overflow:hidden;line-height:0;">
            <div style="position:relative;width:100%;aspect-ratio:1093.5/396;overflow:hidden;background:#fff;">
              <img src="/assets/B307A382-B6FC-4D8D-81C5-3047BDE8F4E3.png?v=merged-village-v1" alt="" draggable="false" style="position:absolute;left:0;top:0;width:118%;height:auto;max-width:none;display:block;clip-path:inset(0 0 22% 0);-webkit-clip-path:inset(0 0 22% 0);pointer-events:none;user-select:none;">
              <a href="index.html?nav=static-1" aria-label="Home" style="position:absolute;left:0;top:0;width:19.02%;height:78.3%;z-index:3;display:block;"></a>
              <a href="about.html?nav=static-1" aria-label="Inside the Village" style="position:absolute;left:19.02%;top:0;width:49.12%;height:78.3%;z-index:3;display:block;"></a>
              <a href="web-design.html?nav=static-1" aria-label="Webspace" style="position:absolute;left:68.14%;top:0;width:16.06%;height:78.3%;z-index:3;display:block;"></a>
              <a href="coming-together.html?nav=static-1" aria-label="Be Coming Together" style="position:absolute;left:84.20%;top:0;width:15.80%;height:78.3%;z-index:3;display:block;"></a>
              <div style="position:absolute;left:0;right:0;bottom:0;height:21.7%;display:grid;grid-template-columns:19.02% 49.12% 16.06% 15.80%;align-items:center;background:#fff;z-index:4;line-height:1;">
                <a href="index.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Home</a>
                <a href="about.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Inside the Village</a>
                <a href="web-design.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Webspace</a>
                <a href="coming-together.html?nav=static-1" style="color:#174f57;text-decoration:none;text-align:center;font:clamp(8px,1.35vw,17px)/1.03 Georgia,'Times New Roman',serif;padding:2px 3px;">Be Coming Together</a>
              </div>
            </div>
          </div>
          <!-- TSBVC-STATIC-NAV-END -->'''
          nav = '\n'.join(line.strip() for line in nav.splitlines())

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text
              marker = re.compile(r'<!--\s*TSBVC-STATIC-NAV-START\s*-->.*?<!--\s*TSBVC-STATIC-NAV-END\s*-->', re.S|re.I)
              if marker.search(new):
                  new = marker.sub(nav, new, count=1)
              elif re.search(r'<div\s+id=["\']tsbvc-static-nav["\']\s*></div>', new, re.I):
                  new = re.sub(r'<div\s+id=["\']tsbvc-static-nav["\']\s*></div>', nav, new, count=1, flags=re.I)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit navigation fixes
        run: |
          git config user.name "The Still Becoming Village Circle"
          git config user.email "waterwinewednesday@gmail.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
          else
            git commit -m "Use merged Village navigation site-wide"
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-merged-village-nav-v2.yml || true
          git config user.name "The Still Becoming Village Circle"
          git config user.email "waterwinewednesday@gmail.com"
          git commit -m "Remove navigation fix workflow" || true
          git push || true
