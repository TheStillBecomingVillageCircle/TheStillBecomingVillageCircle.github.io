name: Fix Kitta Calendly Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Kitta CTA link
        shell: python
        run: |
          from pathlib import Path
          p = Path('kitta.html')
          text = p.read_text(encoding='utf-8')
          old = '''<a
    href="contact.html"
    class="cta-button"
>

    🎨 Explore Creative Work

</a>'''
          new = '''<a
    href="https://calendly.com/thestillbecomingvillagecircle/new-meeting"
    class="cta-button"
    target="_blank"
    rel="noopener"
>

    🎨 Allow Becoming to Create Your Vision

</a>'''
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Kitta CTA updated.')

      - name: Fix Inside the Bubble booking flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'href="#conversation">💬 Ready to Have the Conversation? &nbsp;→':
              'href="#booking">💬 Ready to Take the Next Step? &nbsp;→',
              '<section class="footprints" id="conversation">':
              '<section class="footprints" id="conversation">',
              '<div class="calendly-wrapper">':
              '<div class="calendly-wrapper" id="booking">',
              '🫧 Choose Your Time':
              '🫧 Find Your Moment'
          }

          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          print('Inside the Bubble booking flow updated.')

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-kitta-calendly.yml
          git config user.name "TheStillBecomingVillageCircle"
          git config user.email "waterwinewednesday@gmail.com"
          git add kitta.html about.html .github/workflows/fix-kitta-calendly.yml
          git diff --cached --quiet || git commit -m "Fix booking flow wording and anchor"
          git push
