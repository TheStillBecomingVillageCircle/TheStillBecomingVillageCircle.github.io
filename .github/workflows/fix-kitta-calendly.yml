name: Fix Kitta Calendly Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Kitta Calendly button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Kitta CTA link
        shell: python
        run: |
          from pathlib import Path
          p = Path('kitta.html')
          text = p.read_text(encoding='utf-8')
          old = '''<a
    href="contact.html"
    class="cta-button"
>

    🎨 Explore Creative Work

</a>'''
          new = '''<a
    href="https://calendly.com/thestillbecomingvillagecircle/new-meeting"
    class="cta-button"
    target="_blank"
    rel="noopener"
>

    🎨 Allow Becoming to Create Your Vision

</a>'''
          if old not in text:
              raise SystemExit('Kitta CTA marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-kitta-calendly.yml
      - name: Commit fix
        run: |
          git config user.name "TheStillBecomingVillageCircle"
          git config user.email "waterwinewednesday@gmail.com"
          git add kitta.html .github/workflows/fix-kitta-calendly.yml
          git commit -m "Fix Kitta Calendly button"
          git push
