name: Install Persistent Village Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Install Webspace navigation on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          webspace_li = '<li><a href="web-design.html">Webspace</a></li>'
          persistence_tag = '<script src="village-persistence.js"></script>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Add Webspace directly to every page's actual navigation.
              if 'href="web-design.html"' not in text:
                  nav_match = re.search(r'<nav\b[\s\S]*?</nav>', text, re.IGNORECASE)
                  if nav_match:
                      nav = nav_match.group(0)
                      ul_match = re.search(r'<ul\b[^>]*>[\s\S]*?</ul>', nav, re.IGNORECASE)
                      if ul_match:
                          ul = ul_match.group(0)
                          experience = re.search(r'<li\b[^>]*>[\s\S]*?Experiences[\s\S]*?</li>', ul, re.IGNORECASE)
                          if experience:
                              new_ul = ul[:experience.end()] + '\n' + webspace_li + ul[experience.end():]
                          else:
                              new_ul = ul.replace('</ul>', '\n' + webspace_li + '\n</ul>')
                          nav = nav[:ul_match.start()] + new_ul + nav[ul_match.end():]
                          text = text[:nav_match.start()] + nav + text[nav_match.end():]

              # Keep the shared Village mobile navigation and other enhancements.
              if 'village-persistence.js' not in text:
                  pos = text.lower().rfind('</body>')
                  if pos != -1:
                      text = text[:pos] + '\n' + persistence_tag + '\n' + text[pos:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit navigation fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/install-persistent-navigation.yml
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git commit -m "Fix Webspace navigation across Village pages"
          git push
