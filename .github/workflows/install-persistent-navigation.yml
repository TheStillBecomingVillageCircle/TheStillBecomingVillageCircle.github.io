name: Install Persistent Village Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install persistent Village navigation everywhere
        shell: python
        run: |
          from pathlib import Path

          script_tag = '<script src="village-persistence.js"></script>'
          webspace_item = '<li><a href="web-design.html">Webspace</a></li>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Make Webspace a real link in the HTML, not something that
              # depends on JavaScript successfully running first.
              if 'href="web-design.html"' not in text:
                  marker = '<li><a href="events.html">Experiences</a></li>'
                  if marker in text:
                      text = text.replace(marker, marker + '\n' + webspace_item, 1)
                  else:
                      marker = '<li><a href="contact.html">Connect</a></li>'
                      if marker in text:
                          text = text.replace(marker, webspace_item + '\n' + marker, 1)

              if 'village-persistence.js' not in text:
                  pos = text.lower().rfind('</body>')
                  if pos != -1:
                      text = text[:pos] + '\n' + script_tag + '\n' + text[pos:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit injected navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Make Webspace navigation explicit on every page"
          git push
