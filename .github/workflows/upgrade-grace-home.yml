name: Upgrade Grace Home

on:
  push:
    paths:
      - '.github/workflows/upgrade-grace-home.yml'

permissions:
  contents: write

jobs:
  upgrade-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Replace Home illustration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'<div class="place"><a href="index\.html" aria-label="Home">.*?</div><span class="place-name">Home</span></a></div>'

          replacement = r'''<div class="place"><a href="index.html" aria-label="Home"><div class="scene"><svg viewBox="0 0 240 210" role="img" aria-label="Grace's elegant modern floating home"><defs>
            <linearGradient id="graceCloudLuxury" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d8f5ef"/></linearGradient>
            <linearGradient id="graceWallLuxury" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf8f5"/></linearGradient>
            <linearGradient id="graceRoofLuxury" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f9791"/><stop offset="1" stop-color="#3e6f6a"/></linearGradient>
            <linearGradient id="graceGlassLuxury" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effffb"/><stop offset=".45" stop-color="#b7ebe2"/><stop offset="1" stop-color="#d9f5f0"/></linearGradient>
            <linearGradient id="graceRoseGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2b0aa"/><stop offset="1" stop-color="#b97879"/></linearGradient>
            <filter id="graceLuxuryShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#397c76" flood-opacity=".16"/></filter>
          </defs>
          <g class="grace-luxury-float" filter="url(#graceLuxuryShadow)">
            <path d="M22 157c0-20 17-35 39-35 8-23 34-35 57-24 18-20 52-16 65 8 25-4 47 10 47 31 0 20-18 32-42 32H55c-20 0-33-3-33-12Z" fill="url(#graceCloudLuxury)" stroke="#ffffff" stroke-width="2.5"/>
            <path d="M55 109 118 55l67 54v48H55Z" fill="url(#graceWallLuxury)" stroke="#d0eae5" stroke-width="1.5"/>
            <path d="M43 111 118 48l79 63-10 8-69-55-65 55Z" fill="url(#graceRoofLuxury)" stroke="#4b7872" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M73 101h91v40H73z" fill="url(#graceGlassLuxury)" stroke="#ffffff" stroke-width="4"/>
            <path d="M118 101v40M73 121h91" stroke="#6e9e99" stroke-width="1.5" opacity=".58"/>
            <path d="M63 148h31v22H63zM142 148h31v22h-31z" fill="url(#graceGlassLuxury)" stroke="#ffffff" stroke-width="3.5"/>
            <path d="M79 148v22M157 148v22" stroke="#6e9e99" stroke-width="1.4" opacity=".5"/>
            <path d="M111 169v-25c0-8 5-13 12-13s12 5 12 13v25Z" fill="#5d7f78"/>
            <path d="M177 69h9v26h-9z" fill="url(#graceRoseGold)"/>
            <path d="M56 172h129" stroke="url(#graceRoseGold)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M47 154c-7 5-12 11-14 18M189 154c7 5 12 11 14 18" fill="none" stroke="#78b8a7" stroke-width="3" stroke-linecap="round"/>
            <path d="M51 178c32 7 74 8 113 2" fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="69" cy="99" r="2.2" fill="#e4b4ad" opacity=".8"/><circle cx="169" cy="98" r="2.2" fill="#e4b4ad" opacity=".8"/>
          </g></svg></div><span class="place-name">Home</span></a></div>'''

          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find the current Home illustration; no files changed.')
          path.write_text(updated, encoding='utf-8')

      - name: Commit website change
        run: |
          git config user.name "The Still Becoming Village Circle"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Grace home destination illustration"
          git push

      - name: Remove one-time updater
        run: |
          git rm .github/workflows/upgrade-grace-home.yml
          git commit -m "Remove one-time Grace home updater"
          git push
