name: Remove legacy nav band

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-nav-band.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy navigation bands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'<nav[^>]*class=["\'][^"\']*\bnav-band\b[^"\']*["\'][^>]*>.*?</nav>\s*', re.I | re.S)
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub('', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No legacy nav bands found.'
            exit 0
          fi
          git commit -m '[stable-nav] Remove legacy seven-item navigation bands'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/remove-legacy-nav-band.yml
          git add .github/workflows/remove-legacy-nav-band.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[stable-nav] Remove nav-band cleanup workflow'
          git push
