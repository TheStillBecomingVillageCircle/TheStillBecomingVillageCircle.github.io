name: Fix Inside the Bubble CTA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Inside the Bubble CTA target') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix CTA and booking anchor
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              '💬 Ready to Take the Next Step? &nbsp;→',
              '🌱 Ready to Begin Becoming? &nbsp;→',
              1
          )

          text = text.replace(
              '<section class="footprints" id="conversation">',
              '<section class="footprints" id="conversation">',
              1
          )

          text = text.replace(
              '<p class="calendly-link-wrap"><a class="calendly-link"',
              '<p class="calendly-link-wrap" id="booking"><a class="calendly-link"',
              1
          )

          text = text.replace(
              '<div class="calendly-wrapper" id="booking">',
              '<div class="calendly-wrapper">',
              1
          )

          marker = '.calendly-link-wrap { margin: 0 auto 28px; text-align: center; }'
          if marker in text and 'scroll-margin-top' not in text:
              text = text.replace(
                  marker,
                  marker + '\n#booking { scroll-margin-top: 180px; }',
                  1
              )

          p.write_text(text, encoding='utf-8')

      - name: Commit and remove fixer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html .github/workflows/fix-inside-bubble-cta.yml
          git rm .github/workflows/fix-inside-bubble-cta.yml
          git commit -m "Fix Inside the Bubble CTA target"
          git push
