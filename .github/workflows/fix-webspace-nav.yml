name: One-time Webspace navigation fix

on:
  push:
    paths:
      - '.github/workflows/fix-webspace-nav.yml'
      - 'web-design.html'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[webspace-nav-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared navigation script URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web-design.html')
          s = p.read_text()
          s = s.replace('site-fixes.js?v=20260901-20', 'site-fixes.js?v=20260901-24')
          s = s.replace('rich-nav.js?v=20260901-20', 'rich-nav.js?v=20260901-24')
          s = s.replace('village-music.js?v=20260829-2', 'village-music.js?v=20260901-24')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-design.html
          git diff --cached --quiet && exit 0
          git commit -m '[webspace-nav-fix] Refresh Webspace shared navigation references'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-webspace-nav.yml
          git add .github/workflows/fix-webspace-nav.yml
          git commit -m '[webspace-nav-fix] Remove one-time workflow'
          git push
