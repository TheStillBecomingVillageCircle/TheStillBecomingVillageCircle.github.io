name: Switch every page to navigation v3

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'nav-stable-v3.js'
      - '.github/workflows/switch-navigation-to-v3.yml'

permissions:
  contents: write

jobs:
  switch-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch navigation loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = ['/nav-stable.js?v=stable-1','/nav-stable.js?v=stable-2','/nav-stable.js']
          new = '/nav-stable-v3.js?v=stable-3'
          changed=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              original=text
              for token in old:
                  text=text.replace(token,new)
              if '/nav-stable-v3.js?v=stable-3' not in text and '</body>' in text:
                  text=text.replace('</body>', '<script src="'+new+'"></script>\n</body>', 1)
              if text != original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit page loader changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add '*.html'
          git commit -m '[stable-nav] Switch every page to navigation v3'
          git push

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/switch-navigation-to-v3.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[stable-nav] Remove one-time navigation v3 workflow'
          git push
