name: Fix Journey Into Becoming Button
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button destination
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')
          old = '<button type="button" class="conversation-link" onclick="document.getElementById(\'find-your-moment\').scrollIntoView({behavior:\'smooth\', block:\'start\'});">🌱 Let’s Take a Journey Into Your Becoming &nbsp;→</button>'
          new = '<a class="conversation-link" href="coaching.html">🌱 Let’s Take a Journey Into Your Becoming &nbsp;→</a>'
          if old not in text:
              raise SystemExit('Expected broken journey button not found; no change made.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Point journey button to coaching page"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-journey-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-journey-button.yml
          git commit -m "Remove temporary journey button workflow"
          git push
