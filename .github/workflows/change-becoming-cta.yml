name: Change becoming CTA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/change-becoming-cta.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change CTA wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')
          old = '🌱 Ready to Begin Becoming? &nbsp;→'
          new = '🌱 Let’s Take a Journey Into Your Becoming &nbsp;→'
          if old not in text:
              raise SystemExit('Expected CTA text was not found.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Refine becoming CTA wording"
          git push

      - name: Remove fixer workflow
        if: success()
        run: |
          git rm .github/workflows/change-becoming-cta.yml
          git commit -m "Remove one-time CTA fixer"
          git push
