name: Update Kitta Calendly

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Update Kitta Calendly URL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Calendly URL
        shell: python
        run: |
          from pathlib import Path
          p = Path('about.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://calendly.com/thestillbecomingvillagecircle/30min?hide_gdpr_banner=1'
          new = 'https://calendly.com/thestillbecomingvillagecircle/new-meeting'
          if old not in text:
              raise SystemExit('Old Calendly URL was not found')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow
        run: rm -f .github/workflows/update-kitta-calendly.yml
      - name: Commit URL update
        run: |
          git config user.name "TheStillBecomingVillageCircle"
          git config user.email "waterwinewednesday@gmail.com"
          git add about.html .github/workflows/update-kitta-calendly.yml
          git commit -m "Update Kitta Calendly URL"
          git push
