<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16AAA9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Still Becoming">
  <link rel="manifest" href="/village-app.webmanifest">
  <link rel="icon" href="/village-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/village-icon.svg">
  <title>Still Becoming Village Circle</title>
  <style>
    html,body{margin:0;min-height:100%;background:#F7FCF9;color:#285F61;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center;padding:32px;text-align:center}
    .wrap{max-width:520px}.bubble{width:150px;height:150px;border-radius:50%;margin:0 auto 28px;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 30% 25%,#fff,#d7fdf8 55%,#9fe9df);box-shadow:inset 10px 10px 25px rgba(255,255,255,.8),0 20px 45px rgba(40,120,120,.12)}
    h1{color:#16AAA9;margin:0 0 12px;font-size:34px}.status{color:#5d565f;line-height:1.6}
    a{display:inline-block;margin-top:22px;padding:12px 22px;border-radius:28px;background:#fff;color:#16AAA9;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bubble">🌱</div>
    <h1>Still Becoming</h1>
    <p class="status">Your Village is opening…</p>
    <a href="/">Enter the Village</a>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/village-sw.js', {scope:'/'}).catch(()=>{});
    setTimeout(()=>{ window.location.replace('/'); }, 900);
  </script>

<script src="village-persistence.js"></script>


<script src="/nav-stable.js?v=stable-2"></script>
</body>
</html>
